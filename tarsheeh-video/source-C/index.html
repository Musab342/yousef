<script>
const cap=location.search.includes('cap');
if(cap) document.body.classList.add('cap');
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const backOut=(p,s=1.9)=>{p=p-1;return p*p*((s+1)*p+s)+1};
const expoOut=p=>p>=1?1:1-Math.pow(2,-10*p);
const els=[...document.querySelectorAll('.sc')];
let acc=0;
const scenes=els.map(el=>{const d=TIMING[el.dataset.k];const s={el,k:el.dataset.k,s:acc,e:acc+d,els:[...el.querySelectorAll('.el')]};acc+=d;return s;});
const DUR=acc; window.DUR=DUR; window.SCENES=scenes.map(s=>({k:s.k,s:s.s,e:s.e}));
scenes.forEach(sc=>sc.els.forEach(e=>{e._b=e.style.transform||'';}));
const vids={}; document.querySelectorAll('video').forEach(v=>vids[v.id.slice(2)]=v);
const logo=document.getElementById('logo'), logoT=document.getElementById('logoT'), flash=document.getElementById('flash');
function apply(e,tl){
  const a=e.dataset.a,t0=+(e.dataset.t||0),x=tl-t0,b=e._b;let tr='',op=1;
  if(a==='pop'){const k=backOut(clamp(x/.42));tr=`scale(${.3+.7*k})`;op=clamp(x/.12);}
  else if(a==='punch'){const p=clamp(x/.38);const k=backOut(p,2.6);tr=`scale(${1.9-0.9*k})`;op=clamp(x/.08);}
  else if(a==='up'){const k=expoOut(clamp(x/.45));tr=`translateY(${(1-k)*46}px)`;op=clamp(x/.18);}
  else if(a==='stamp'){const k=backOut(clamp(x/.3),2.4);tr=`scale(${2.2-1.2*k}) rotate(${(1-k)*-12}deg)`;op=clamp(x/.07);}
  else if(a==='wipe'||a==='bar'){const k=expoOut(clamp(x/(a==='bar'?.9:.35)));tr=`scaleX(${k})`;op=k>0?1:0;}
  else if(a==='fade'){op=clamp(x/.25);tr=`translateX(${(1-expoOut(clamp(x/.35)))*-20}px)`;}
  else if(a==='drop'){const k=backOut(clamp(x/.5),1.6);tr=`translateY(${(1-k)*-620}px)`;op=clamp(x/.05);}
  else if(a==='slideL'){const k=backOut(clamp(x/.45));tr=`translateX(${(1-k)*-360}px)`;op=clamp(x/.05);}
  else if(a==='slideR'){const k=backOut(clamp(x/.45));tr=`translateX(${(1-k)*360}px)`;op=clamp(x/.05);}
  else if(a==='card'){const k=backOut(clamp(x/.42),1.7);tr=`translateX(${(1-k)*-560}px) rotate(${(1-k)*-8}deg)`;op=clamp(x/.05);}
  else if(a==='spinin'){const k=backOut(clamp(x/.5));tr=`scale(${k}) rotate(${(1-k)*-160 + Math.sin(tl*5)*6}deg)`;op=clamp(x/.05);}
  else if(a==='mag'){const k=expoOut(clamp(x/.6));tr=`translate(${(1-k)*160 + Math.sin(tl*3)*8}px,${(1-k)*200 + Math.cos(tl*3)*6}px)`;op=clamp(x/.1);}
  else if(a==='draw'){const c=e.querySelector('ellipse');c.setAttribute('stroke-dashoffset',320*(1-expoOut(clamp(x/.5))));op=x>0?1:0;}
  // gentle float after entry
  if(['pop','stamp','drop'].includes(a) && x>0.5) tr+=` translateY(${Math.sin((tl+t0)*2.4)*3}px)`;
  e.style.transform=(tr+' '+b).trim(); e.style.opacity=op;
}
function render(t){
  let need={};
  for(const sc of scenes){
    const on=t>=sc.s&&t<sc.e; sc.el.style.display=on?'block':'none'; if(!on) continue;
    const tl=t-sc.s, d=sc.e-sc.s;
    // scene transition: punch-in at start, slight push through
    const inP=clamp(tl/.22); const z=1+(1-expoOut(inP))*.12 + tl*.01;
    const outP=clamp((tl-(d-.12))/.12);
    sc.el.style.transform=`scale(${z + outP*.08})`;
    sc.el.style.filter=outP>0?`blur(${outP*6}px)`:'';
    sc.els.forEach(e=>apply(e,tl));
    if(sc.el.dataset.vid){const v=vids[sc.el.dataset.vid];const r=Math.min(1,(v.duration-0.06)/d);need[sc.el.dataset.vid]=tl*r;}
    const dark=sc.el.classList.contains('bgN')||sc.el.classList.contains('bgG');
    logo.style.color=dark?'#fff':'#0E1A2B'; logo.style.display=sc.k==='c10'?'none':'flex';
    flash.style.opacity= tl<.06 && sc.s>0 ? .5*(1-tl/.06) : 0;
  }
  const c=document.getElementById('cnt'); const s9=scenes.find(s=>s.k==='c7'); if(c&&s9){c.textContent=Math.round(500*expoOut(clamp((t-s9.s-1.0)/1)));}
  return need;
}
window.renderAt=async t=>{
  const need=render(t);
  for(const k in need){const v=vids[k];const vt=Math.min(need[k],v.duration-0.05);
    if(Math.abs(v.currentTime-vt)>0.001) await new Promise(r=>{v.onseeked=r;v.currentTime=vt;});}
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
};
if(!cap){let st=performance.now();document.getElementById('ui').onclick=()=>st=performance.now();
 (function loop(){const t=((performance.now()-st)/1000)%DUR;const need=render(t);
  for(const k in vids){const v=vids[k]; if(k in need){ if(v.paused) v.play().catch(()=>{}); if(Math.abs(v.currentTime-need[k])>.3) v.currentTime=need[k]; } else if(!v.paused) v.pause();}
  requestAnimationFrame(loop)})();}
</script>
</body>
</html>
